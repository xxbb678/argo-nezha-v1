services:
  argo-nezha-v1:
    image: ghcr.io/xxbb678/argo-nezha-v1:latest
    container_name: argo-nezha-v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
    env_file:
      - .env
    volumes:
      - ./dashboard:/dashboard/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
